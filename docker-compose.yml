# Local infrastructure. Start with:  npm run db:up
services:
  postgres:
    # Official Postgres 17 with the pgvector extension pre-installed.
    # We don't need pgvector yet; Phase 1 uses it for duplicate detection.
    image: pgvector/pgvector:pg17
    container_name: synthcore_postgres
    environment:
      POSTGRES_USER: synthcore
      POSTGRES_PASSWORD: synthcore # local development only, never use in production
      POSTGRES_DB: synthcore
    ports:
      - "5432:5432"
    volumes:
      # A named volume keeps the data when the container is removed or restarted.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthcore"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
